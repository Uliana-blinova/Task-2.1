<!-- base.html (правильно) -->
<!DOCTYPE html>
<html>
<head>...</head>
<body>
    <nav>
        <ul>
            {% if user.is_authenticated %}
                {% if user.is_superuser %}
                    <!-- Меню для СУПЕРПОЛЬЗОВАТЕЛЯ (Администратора) -->
                    <li><a href="{% url 'manage_categories' %}">Управление категориями</a></li>
                    <li><a href="{% url 'view_all_applications_admin' %}">Изменить статус заявок</a></li>
                {% else %}
                    <!-- Меню для ОБЫЧНОГО ЗАРЕГИСТРИРОВАННОГО ПОЛЬЗОВАТЕЛЯ -->
                    <li><a href="{% url 'my_applications' %}">Мои заявки</a></li>
                    <li><a href="{% url 'create_application' %}">Создать заявку</a></li>
                {% endif %} <!-- Закрывает {% if user.is_superuser %} -->
                <!-- НЕТ НУЖДЫ В ДОПОЛНИТЕЛЬНОМ {% endif %} ЗДЕСЬ -->
            {% else %}
                <!-- Меню для НЕАВТОРИЗОВАННОГО ПОЛЬЗОВАТЕЛЯ -->
                <li><a href="{% url 'login' %}">Войти</a></li>
                <li><a href="{% url 'register' %}">Зарегистрироваться</a></li>
            {% endif %} <!-- Закрывает {% if user.is_authenticated %} -->
        </ul>
    </nav>

    {% block content %}{% endblock %}

</body>
</html>
