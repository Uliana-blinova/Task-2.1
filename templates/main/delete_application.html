{% extends 'main/base.html' %}

{% block title %}Удалить заявку? - Design.pro{% endblock %}

{% block content %}
    <h2>Удалить заявку?</h2>
    <p>Вы уверены, что хотите удалить заявку: "{{ application.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <div class="delete">
            <button type="submit">Да, удалить</button>
            <a href="{% url 'my_applications' %}">Отмена</a>
        </div>

    </form>
{% endblock %}
